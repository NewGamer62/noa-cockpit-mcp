name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Test on Node ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22.x, 24.x]
        os: [windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go (pour dépendance repo-doctor)
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Compiler repo-doctor pour tests d'intégration
        shell: bash
        run: |
          git clone https://github.com/NewGamer62/repo-doctor.git temp-rd
          cd temp-rd
          go build -ldflags="-s -w" -o ../repo-doctor.exe .
          cd ..
          rm -rf temp-rd
          echo "$PWD" >> $GITHUB_PATH

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler TypeScript
        run: npm run build

      - name: Exécuter les tests unitaires
        run: npm test
